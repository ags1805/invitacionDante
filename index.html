<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Mi Primer Año! - Dante</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Homemade+Apple&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="fixed-background"></div>
    <div id="stars-container"></div>

    <div class="shooting-star" style="top: 10%; left: 10%; animation-delay: 0s;"></div>
    <div class="shooting-star" style="top: 30%; left: 50%; animation-delay: 4s;"></div>

    <div class="space-objects-container">
        <div class="moving-object ufo-1">
            <div class="ufo">
                <div class="ufo-lights"><span class="light"></span><span class="light"></span><span
                        class="light"></span></div>
            </div>
        </div>
        <div class="moving-object ufo-2">
            <div class="ufo">
                <div class="ufo-lights"><span class="light"></span><span class="light"></span><span
                        class="light"></span></div>
            </div>
        </div>
        <div class="moving-object astronaut">👨‍🚀</div>
        <div class="moving-object satellite">🛰️</div>
        <div class="moving-object rock">☄️</div>
    </div>

    <main class="container">

        <section class="hero reveal">
            <div class="rocket-wrapper">
                <span class="rocket">🚀</span>
            </div>
            <h2 class="subtitle">Mi primer año</h2>
            <h1 class="title">Dante</h1>
            <p class="tagline">¡Despegamos hacia una aventura inolvidable!</p>
        </section>

        <section class="countdown-section reveal">
            <h3>Faltan:</h3>
            <div id="countdown">
                <div class="time-unit"><span id="days">00</span><small>Días</small></div>
                <div class="time-unit"><span id="hours">00</span><small>Hs</small></div>
                <div class="time-unit"><span id="minutes">00</span><small>Min</small></div>
                <div class="time-unit"><span id="seconds">00</span><small>Sec</small></div>
            </div>
        </section>

        <section class="info-card reveal">
            <div class="info-grid">
                <div class="info-item">
                    <span class="icon">📅</span>
                    <p><strong>16 de Agosto</strong></p>
                </div>
                <div class="info-item">
                    <span class="icon">⏰</span>
                    <p><strong>16 a 19hs</strong></p>
                </div>
                <div class="info-item">
                    <span class="icon">📍</span>
                    <p><strong>Laprida 4063, Villa Lynch</strong></p>
                </div>
            </div>
            <a href="https://maps.google.com/?q=Laprida+4063+Villa+Lynch" target="_blank" class="btn btn-secondary">
                Ver Ubicación en Maps
            </a>
        </section>

        <section class="rsvp-section reveal">
            <h3>Confirmar Asistencia</h3>
            <form id="rsvp-form">
                <input type="text" id="guest-name" placeholder="Tu nombre" required>
                <input type="number" id="guest-count" placeholder="¿Cuántos vienen?" min="1" required>

                <button type="submit" class="btn btn-whatsapp">
                    Confirmar por WhatsApp
                </button>
            </form>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
